<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>scrollring demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 24px;
            font-family: sans-serif;
        }

        #list {
            width: 400px;
            height: 400px;
            overflow-y: auto;
            border: 1px solid #bbb;
        }

        #info {
            margin: 12px 0;
            font-family: monospace;
        }

        #scroll-container{
            height:0px;
            border:1px solid black;
        }
    </style>
</head>

<body>
    <h1>scrollring</h1>
    <div id="info"></div>
    <div id="list"></div>

    <div id="scroll-container"></div>
    <script type="module" src="./main.js"></script>
</body>

</html>
